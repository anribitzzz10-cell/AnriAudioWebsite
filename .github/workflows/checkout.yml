name: Private order page (offline browser)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Order recovery security checks
        run: node tests/order-claim.node.cjs
      - name: Synthetic browser flow (no merchant or backend traffic)
        run: |
          node tests/static-server.cjs > /tmp/anri-static-http.log 2>&1 &
          npx playwright test tests/checkout.spec.js tests/micro_pilot.spec.js --workers=1

