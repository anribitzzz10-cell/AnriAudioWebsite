name: ANRI Kaspi Pay website route
on:
  pull_request:
    paths:
      - 'server.cjs'
      - 'kaspi/**'
      - 'tests/proxy.node.cjs'
      - 'package.json'
      - '.github/workflows/kaspi-checkout.yml'
  push:
    branches: [main]
    paths:
      - 'server.cjs'
      - 'kaspi/**'
      - 'tests/proxy.node.cjs'
      - 'package.json'
      - '.github/workflows/kaspi-checkout.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run official-site proxy and order-claim regression tests
        run: npm test
