name: Seller Info — Public Website Read-Only Audit
on:
  push:
    branches:
      - feature/kaspi-checkout-preview-20261023
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check published seller identification pages without printing PII
        run: python tests/seller_public_info_audit.py
