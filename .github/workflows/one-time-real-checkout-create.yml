name: One real 18000 KZT order creation, zero payment
on:
  pull_request:
permissions:
  contents: read
jobs:
  create-one-unpaid-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real checkout request on isolated website and railway server; never pay
        run: python3 tests/one_real_checkout_create_once.py
