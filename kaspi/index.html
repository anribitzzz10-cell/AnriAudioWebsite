  kk:{kicker:"Қазақстан · бөлек төлем тәсілі",title:"Kaspi Pay арқылы төлеу",lead:"Logic Pro үшін ANRI AUDIO MIDI · мерзімсіз FULL лицензия, екі құрылғыға дейін белсендіру. Бұл тәсіл Қазақстандағы сатып алушыларға арналған.",licenseTitle:"ANRI AUDIO MIDI · FULL",priceNote:"Бастапқы ұсыныс — $39 орнына $15. Kaspi Pay төлемінің нақты теңге сомасы бөлек бекітіліп, төлеуге дейін көрсетіледі.",closed:"Kaspi Pay арқылы төлем әлі ашылған жоқ: ресми сілтеме мен теңгедегі нақты баға бекітілмеген. Жеке картаға аударым жасамаңыз.",ready:"Kaspi Pay ресми төлем беті ашылады. Сатып алушы көрсетілген соманы теңгемен өзі енгізеді. Лицензия автоматты түрде берілмейді.",pay:"Kaspi Pay арқылы төлеу",disabled:"Kaspi Pay — жақында",stepsTitle:"Лицензияны қалай алуға болады",step1:"Теңгедегі бағаны, өнімді және алушы «Анрипрод» ЖК екенін тексеріңіз. Мәліметтер сәйкес келмесе, төлем жасамаңыз.",step2:"Сілтемені Kaspi.kz қолданбасында ашып, нақты соманы енгізіңіз. Төлем түсіндірмесінде ANRI AUDIO MIDI FULL деп жазыңыз.",step3:"Төлеген соң лицензия қажет электрондық поштаңыздан ANRI AUDIO қолдау қызметіне жазыңыз. Төлем күні мен сомасын, салыстыруға қажет деректерді көрсетіңіз; карта деректерін және құпия кодтарды жібермеңіз.",step4:"Сатушы түскен төлемді өзінің Kaspi POS/«Тарих» бөлімінде тексереді. Осыдан кейін ғана Anri Cloud мерзімсіз FULL лицензия береді; скриншот өздігінен төлемді растамайды.",safety:"Ерікті қолдау, жеке картаға аударым, бөгде сілтеме және ресейлік ProEducation төлемі Kaspi Pay арқылы лицензия сатып алу болып саналмайды. Автоматты webhook пен кілтті дереу беру жоқ.",contact:"Тапсырыс бойынша көмек: anribitzzz10@gmail.com",footer:"Қазақстан · төлемді қолмен тексеру"},
  en:{kicker:"Kazakhstan · separate payment option",title:"Pay using Kaspi Pay",lead:"ANRI AUDIO MIDI for Logic Pro · perpetual FULL license with up to two device activations. This method is for buyers in Kazakhstan.",licenseTitle:"ANRI AUDIO MIDI · FULL",priceNote:"Launch offer: $15 instead of $39. A separate fixed Kaspi Pay price in KZT must be approved and clearly displayed before any payment.",closed:"Kaspi Pay checkout is not open. The official merchant link and exact price in KZT have not been approved. Do not send money to personal bank cards.",ready:"This opens the official Kaspi Pay page. Buyers manually enter the exact displayed KZT amount. Payment does not automatically issue a license.",pay:"Open Kaspi Pay payment",disabled:"Kaspi Pay — coming soon",stepsTitle:"How to receive your license",step1:"Verify the KZT amount, product and merchant: Anriprod sole proprietorship. Do not pay if they differ.",step2:"Open the link in Kaspi.kz, enter the exact amount shown and add ANRI AUDIO MIDI FULL in the payment comment.",step3:"After payment, email ANRI AUDIO support from the address intended for licensing. Provide payment date, amount and matching information, but never card details or verification codes.",step4:"The merchant independently checks the transaction in their Kaspi POS history. Only after that verification does Anri Cloud issue a perpetual FULL license. Screenshots and buyer claims are not proof of payment.",safety:"Donations, personal transfers, third-party links and the Russia-only ProEducation method are not a Kaspi Pay license purchase. No automated webhook or instant key delivery is claimed.",contact:"Order support: anribitzzz10@gmail.com",footer:"Kazakhstan · manually verified payment"}
 }[lang];
 const set=(id,v)=>{document.getElementById(id).textContent=v};
 for(const id of ["kicker","title","lead","licenseTitle","priceNote","stepsTitle","step1","step2","step3","step4","safety","contact","footer"])set(id,copy[id]);
 const cfg=window.ANRI_KASPI_KZ||{};
 let u=null;
 try{u=new URL(cfg.paymentUrl||"")}catch{}
 const valid=cfg.enabled===true && Number.isSafeInteger(cfg.amountKzt)&&cfg.amountKzt>0
    &&u && u.protocol==="https:" && u.hostname==="pay.kaspi.kz"

 if(valid){

    const pay=document.getElementById("payLink");
    pay.href=u.href; pay.textContent=copy.pay; pay.hidden=false;

 }else{

    set("availability",copy.closed);
    set("payDisabled",copy.disabled);
 }
});
